<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Camera</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/three.js/build/ar-threex.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js" defer></script>

    <link rel="stylesheet" href="ar_gcs_style.css"/>
  </head>
  <body>
    <div id="orientationWarning">
      Пожалуйста отключите автоматическую ориентацию экрана,<br>
      а затем снова поверните ваш телефон вертикально
    </div>

    <div id="loadingScreen">
      <div id="loadingText">Загрузка...</div>
    </div>

    <div id="holdMessage">🍊 Апельсин должен быть на гармошке Гены</div>

    <img id="overlayGif" src="images/Cloud_Sticker.gif" alt="AR Overlay" />
    <img id="musicGif" src="images/music-notes-sound.gif" alt="Музыкальные ноты" />
    <img id="lariskaGif" src="images/lariska_animation.gif" alt="Лариска анимация" />
    <img id="grassImg" src="images/grass.png" alt="Трава" />
    <img id="genaPointImg" src="images/NPK_OBJECT_05.png" alt="Точка Гены" />

    <audio id="backgroundMusic" src="audio/gena_song.mp3" loop></audio>

    <canvas id="overlay"></canvas>
    <button id="captureBtn">Сделать фото</button>

    <script>
      let scene, camera, renderer, source, arToolkitContext, model;
      let overlay, overlayCtx;
      let frameCounter = 0;

      let detectionDone = false;
      let genaCenter = null;
      let genaDetections = [];

      let model_3d = null;
      let model_3d_2 = null;

      let showGenaPoint = true;


      // ---------------- Overlay ----------------
      function initOverlay() {
        overlay = document.getElementById('overlay');
        overlay.width = window.innerWidth;
        overlay.height = window.innerHeight;
        overlayCtx = overlay.getContext('2d');

        window.addEventListener('resize', () => {
          overlay.width = window.innerWidth;
          overlay.height = window.innerHeight;
        });
      }

      // ---------------- AR.js ----------------
      function initAR() {
        scene = new THREE.Scene();
        camera = new THREE.Camera();
        scene.add(camera);

        renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        source = new THREEx.ArToolkitSource({sourceType:'webcam', sourceWidth:1920, sourceHeight:1080});
        source.init(() => onResize());
        window.addEventListener('resize', () => onResize());

        function onResize() {
          source.onResizeElement();
          source.copyElementSizeTo(renderer.domElement);
          if(arToolkitContext && arToolkitContext.arController)
            source.copyElementSizeTo(arToolkitContext.arController.canvas);
        }

        arToolkitContext = new THREEx.ArToolkitContext({
          cameraParametersUrl: './camera_para.dat',
          detectionMode: 'mono'
        });

        arToolkitContext.init(() => camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix()));
        

        // 💡 Свет
        scene.add(new THREE.AmbientLight(0xffffff, 1));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(1, 1, 1);
        scene.add(dirLight);

      }

      // ---------------- Capture frame ----------------
      function captureFrame() {
        if(!source || !source.ready) return null;
        let tensor = tf.browser.fromPixels(source.domElement);
        tensor = tf.image.resizeBilinear(tensor, [416,416]);
        tensor = tensor.expandDims(0).toFloat().div(tf.scalar(255));
        return tensor;
      }

      // ---------------- Decode YOLO ----------------
      function decodeYOLO(predictions, overlayWidth, overlayHeight, confThreshold = 0.3) {
      const data = predictions.arraySync()[0]; // [8, 3549]
      const boxes = [];
      const inputSize = 416;
      const scaleX = overlayWidth / inputSize;
      const scaleY = overlayHeight / inputSize;

      const numBoxes = data[0].length;

      for (let i = 0; i < numBoxes; i++) {
        const objConf = 1 / (1 + Math.exp(-data[4][i])); // сигмоида

        let bestClassIdx = -1;
        let bestClassScore = 0;

        for (let c = 5; c < data.length; c++) {
          const classScore = 1 / (1 + Math.exp(-data[c][i]));
          if (classScore > bestClassScore) {
            bestClassScore = classScore;
            bestClassIdx = c - 5;
          }
        }

        // Финальная уверенность как произведение
        const finalConf = objConf * bestClassScore;

        if (finalConf < confThreshold) continue;

        const cx = data[0][i] * scaleX;
        const cy = data[1][i] * scaleY;
        const w = data[2][i] * scaleX;
        const h = data[3][i] * scaleY;

        boxes.push({
          x: cx - w / 2,
          y: cy - h / 2,
          w,
          h,
          cx,
          cy,
          conf: finalConf,
          cls: bestClassIdx
        });
      }

      console.log("📊 Примеры боксов:", boxes.slice(0, 10));
      return boxes;
    }

    // ---------------- Animate ----------------
    async function animate() {
      requestAnimationFrame(animate);
      if (!(source && source.ready && arToolkitContext)) return;
      arToolkitContext.update(source.domElement);

      // ------------------ Плавное парение
      if (model_3d) {
        // Сохраняем начальную позицию Y
        if (model_3d.userData.baseY === undefined) {
          model_3d.userData.baseY = model_3d.position.y;
          model_3d.userData.floatOffset = 0; // начальное смещение для синуса
        }

        // Обновляем смещение
        model_3d.userData.floatOffset += 0.01; // скорость колебания

        const floatHeight = 0.05; // амплитуда парения
        model_3d.position.y = model_3d.userData.baseY + Math.sin(model_3d.userData.floatOffset) * floatHeight;

        model_3d_2.rotation.y += 0.01;
      }

      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      frameCounter++;

      if (genaCenter && showGenaPoint) {
        const genaImg = document.getElementById('genaPointImg');
        genaImg.style.display = 'block';
        genaImg.style.left = `${genaCenter.x}px`;
        genaImg.style.top = `${genaCenter.y}px`;
        return; // ⛔️ прекращаем распознавание
      } else {
        const genaImg = document.getElementById('genaPointImg');
        genaImg.style.display = 'none';
      }


      if (model && frameCounter % 8 === 0) {
        const input = captureFrame();
        if (input) {
          try {
            const predictions = await model.executeAsync(input);
            const boxes = decodeYOLO(predictions, overlay.width, overlay.height, 0.3);
            tf.dispose(predictions);
            tf.dispose(input);

            overlayCtx.strokeStyle = 'lime';
            overlayCtx.fillStyle = 'red';
            overlayCtx.lineWidth = 2;

            boxes.forEach(b => {
              overlayCtx.strokeRect(b.x, b.y, b.w, b.h);
              overlayCtx.beginPath();
              overlayCtx.arc(b.cx, b.cy, 3, 0, 2 * Math.PI);
              overlayCtx.fill();

              const labels = ["Гена", "Шапокляк", "Чебурашка", "Волк"];
              overlayCtx.fillStyle = 'yellow';
              overlayCtx.font = '16px Arial';
              overlayCtx.fillText(`${labels[b.cls] || "?"} ${(b.conf * 100).toFixed(1)}%`, b.x, b.y - 5);

              // 📍 Сохраняем центр Гены
              if (labels[b.cls] === "Гена" && genaDetections.length < 5) {
                genaDetections.push({ x: b.cx, y: b.cy });
                console.log("📌 Найдена Гена:", b.cx, b.cy);
                if (genaDetections.length === 5) {
                  // средняя точка по 5 кадрам
                  const sum = genaDetections.reduce((acc, val) => ({ x: acc.x + val.x, y: acc.y + val.y }), {x:0, y:0});
                  genaCenter = { x: sum.x / 5, y: sum.y / 5 };
                  console.log("✅ Центр Гены:", genaCenter);

                  // 🛑 Останавливаем модель
                  model = null;

                  // 📢 Показываем сообщение
                  const holdMsg = document.getElementById('holdMessage');
                  holdMsg.style.display = 'block';

                  // ⏱️ Через 10 секунд скрываем сообщение и показываем гифку
                  setTimeout(() => {
                    holdMsg.style.display = 'none';
                    document.getElementById('overlayGif').style.display = 'block';

                     // ✅ Добавляем появление травы
                    const grassImg = document.getElementById('grassImg');
                    grassImg.style.display = 'block';

                    // 🎵 Добавляем гиф с нотами на место Гены
                    const musicGif = document.getElementById('musicGif');
                    musicGif.style.display = 'block';
                    musicGif.style.left = `${genaCenter.x - 60}px`; // центрируем
                    musicGif.style.top = `${genaCenter.y - 60}px`;

                    // 🔊 Включаем музыку по кругу
                    const bgMusic = document.getElementById('backgroundMusic');
                    bgMusic.volume = 0.7;
                    bgMusic.play().then(() => {
                      console.log("🎵 Музыка Гены начала играть!");
                    }).catch(err => console.warn("⚠️ Не удалось запустить музыку:", err));


                    // 🐀 Добавляем гиф с Лариской (справа и чуть ниже Гены)
                    const lariskaGif = document.getElementById('lariskaGif');
                    lariskaGif.style.display = 'block';
                    lariskaGif.style.left = `${genaCenter.x + 150}px`;
                    lariskaGif.style.top = `${genaCenter.y + 15}px`;

                    // Добавляем куб в сцену
                    showGenaPoint = false;
                  }, 7500);
                }
              }
            });
          } catch (e) {
            console.error(e);
          }
        }
      }

      //if (renderer && scene && camera) renderer.render(scene, camera);
      renderer.render(scene, camera);
    }

      // ---------------- Init ----------------
      window.addEventListener('DOMContentLoaded', async ()=>{
        initOverlay();
        initAR();

        console.log("📦 Загружаем модель...");
        try{
          model = await tf.loadGraphModel('./tfjs_model/model.json');
          console.log('✅ Модель загружена!');

          const loadingScreen = document.getElementById('loadingScreen');
          if (loadingScreen) {
            loadingScreen.style.display = 'none';
          }
        } catch(e){ console.error(e); }
        animate();
      });

      // ---------------- Orientation ----------------
      const warningDiv = document.getElementById('orientationWarning');
      function checkOrientation(){
        const isPortrait = window.innerHeight > window.innerWidth;
        if(!isPortrait){
          warningDiv.style.display='flex';
        } else if(warningDiv.style.display==='flex'){
          warningDiv.style.display='none';
          if(renderer) document.body.removeChild(renderer.domElement);
          initAR();
        }
      }
      window.addEventListener('orientationchange', checkOrientation);
      window.addEventListener('resize', checkOrientation);


      // ---------------- Capture Photo ----------------
      function getVideoElement() {
        return new Promise((resolve, reject) => {
          let attempts = 0;
          const interval = setInterval(() => {
            const video = document.querySelector('video');
            if (video) {
              clearInterval(interval);
              resolve(video);
            }
            attempts++;
            if (attempts > 50) {
              clearInterval(interval);
              reject(new Error("Не удалось найти видеоэлемент камеры"));
            }
          }, 20);
        });
      }

      const captureBtn = document.getElementById("captureBtn");

      captureBtn.addEventListener('click', async () => {
        let videoElement;
        try {
          videoElement = await getVideoElement();
        } catch (err) {
          console.error(err);
          alert("Ошибка: видеопоток камеры не найден.");
          return;
        }

        requestAnimationFrame(() => {
          try {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = window.innerWidth;
            tempCanvas.height = window.innerHeight;
            const ctx = tempCanvas.getContext('2d');

            // Нарисовать видеопоток с камеры
            ctx.drawImage(videoElement, 0, 0, tempCanvas.width, tempCanvas.height);

            // Нарисовать облачка
            const overlayGif = document.getElementById('overlayGif');
            if (overlayGif.style.display !== 'none') {
              const rect = overlayGif.getBoundingClientRect();
              ctx.drawImage(overlayGif, rect.left, rect.top, rect.width, rect.height);
            }

            // Нарисовать гифку нот
            const musicGif = document.getElementById('musicGif');
            if (musicGif.style.display !== 'none') {
              const rect = musicGif.getBoundingClientRect();
              ctx.drawImage(musicGif, rect.left, rect.top, rect.width, rect.height);
            }

            // Нарисовать гифку Лариски
            const lariskaGif = document.getElementById('lariskaGif');
            if (lariskaGif.style.display !== 'none') {
              const rect = lariskaGif.getBoundingClientRect();
              ctx.drawImage(lariskaGif, rect.left, rect.top, rect.width, rect.height);
            }

            // Нарисовать траву
            const grassImg = document.getElementById('grassImg');
            if (grassImg.style.display !== 'none') {
              const rect = grassImg.getBoundingClientRect();
              ctx.drawImage(grassImg, rect.left, rect.top, rect.width, rect.height);
            }

            // Сохранить результат
            const dataURL = tempCanvas.toDataURL('image/png');
            if (dataURL.length < 50) throw new Error("Сгенерированное фото слишком маленькое.");

            localStorage.setItem("capturedPhoto", dataURL);
            window.location.href = "photo.html";

          } catch (err) {
            console.error("Ошибка при сохранении скриншота:", err);
            alert("Не удалось сделать фото :(\n" + err.message);
          }
        });
      });


    </script>
  </body>
</html>
