<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ну погоди</title>
  
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  
  <link rel="stylesheet" href="ar_wolf_style.css"/>
</head>
<body>
  <video id="cameraFeed" autoplay playsinline muted></video>

  <a-scene>
    <a-assets>
        <a-asset-item id="character-model" src="./3d_models/Wolk.glb" crossorigin="anonymous"></a-asset-item>
        <img id="portal-frame" src="./images/Group 1.png" crossorigin="anonymous" />
    </a-assets>

    <a-entity light="type: ambient; intensity: 0.8; color: #ffffff"></a-entity>
    <a-entity light="type: directional; intensity: 0.6; color: #ffffff" position="2 4 2"></a-entity>

    <a-camera look-controls></a-camera>
  </a-scene>
  <div id="touchMessage">Коснись, чтобы открыть окно в СоюзМультПарк!</div>
  <div id="swipeMessage">Проведи пальцем по экрану</div>
  <button id="captureBtn">Сделать фото</button>

  <script src="./js/ar_wolf.js"></script>
</body>
</html>
